# Generates the animated contribution snake and pushes it to the "output" branch.
# The README reads the SVGs from:
#   https://raw.githubusercontent.com/rifat15-4084/rifat15-4084/output/github-snake.svg
#   https://raw.githubusercontent.com/rifat15-4084/rifat15-4084/output/github-snake-dark.svg
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches: [main, master]

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#39ff14&color_dots=#00f5ff,#8a2be2,#39ff14,#00f5ff,#8a2be2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39ff14&color_dots=#00f5ff,#8a2be2,#39ff14,#00f5ff,#8a2be2

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
