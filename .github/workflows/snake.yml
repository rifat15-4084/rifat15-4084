# Generates the animated contribution snake AND the activity graph,
# then pushes both to the "output" branch in a single atomic commit so
# neither asset can overwrite the other.
#
# The README reads these from:
#   https://raw.githubusercontent.com/rifat15-4084/rifat15-4084/output/github-snake.svg
#   https://raw.githubusercontent.com/rifat15-4084/rifat15-4084/output/github-snake-dark.svg
#   https://raw.githubusercontent.com/rifat15-4084/rifat15-4084/output/activity-graph.svg
#
# NOTE: the activity graph is generated here instead of being hot-linked to
# github-readme-activity-graph.vercel.app because that host now returns
# HTTP 402 (Payment Required) for every request.
name: Generate Snake & Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches: [main, master]

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Snake SVGs -> build/snake/
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            build/snake/github-snake.svg?palette=github-dark&color_snake=#39ff14&color_dots=#00f5ff,#8a2be2,#39ff14,#00f5ff,#8a2be2
            build/snake/github-snake-dark.svg?palette=github-dark&color_snake=#39ff14&color_dots=#00f5ff,#8a2be2,#39ff14,#00f5ff,#8a2be2

      # Activity graph -> build/graph/ (neon palette on #0d1117)
      - name: Generate the activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: 'theme=tokyo-night&bg_color=0d1117&color=00f5ff&title_color=39ff14&line=8a2be2&point=39ff14&area=true&area_color=8a2be2&hide_border=true'
          output_path: build/graph/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Stage everything into one folder so a single push carries all three files.
      - name: Collect assets
        run: |
          mkdir -p dist
          cp build/snake/*.svg dist/
          cp build/graph/*.svg dist/
          echo "Assets ready for publish:"
          ls -la dist

      # If ANY generation step fails, this push never runs, so the output
      # branch keeps its last known-good files instead of losing them.
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
